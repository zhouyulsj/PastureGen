version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: breeding
      POSTGRES_PASSWORD: breeding
      POSTGRES_DB: breeding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: breeding
      POSTGRES_PASSWORD: breeding
      POSTGRES_DB: sensor
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: breeding
      MINIO_ROOT_PASSWORD: breeding123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  tsdata:
  miniodata: