[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pasturegen"
version = "0.1.0"
description = "PastureGen —— AI 智能牧场育种平台（多畜种、多租户）"
license = "MulanPSL-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
edge = [
    "paho-mqtt>=2.0",
    "pymodbus>=3.6",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Ruff 配置已就绪，供本地与后续 CI 使用：
#   python -m ruff check . && python -m ruff format --check .
# 注：CI 暂未强制该步骤（需先把存量告警清零），见 TODO.md。
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 交由 line-length 控制；中文注释与文档字符串不强制折行
ignore = ["E501"]